<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200" />
    <title>Forge Promo — コミュニティ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="artboard" id="artboard">
      <aside class="sidebar">
        <div class="logo">
          <div class="logo-mark">🔥</div>
          <span class="logo-text">Forge</span>
        </div>
        <nav>
          <a class="nav-link" href="home.html">ホーム</a>
          <a class="nav-link" href="#">作品を探す</a>
          <div class="nav-section">
            <div class="nav-label">マイページ</div>
            <a class="nav-link active" href="community.html">コミュニティ</a>
          </div>
        </nav>
      </aside>
      <div class="main">
        <header class="header">
          <div class="search">🔍 ゲームやジャンルを検索</div>
          <div class="header-actions">
            <div class="icon-btn">🔔</div>
            <div class="icon-btn">👤</div>
          </div>
        </header>
        <div class="content">
          <div class="community-head">
            <div class="community-avatar"></div>
            <div>
              <h2 class="community-name">深夜コンビニ防衛線 コミュニティ</h2>
              <p class="community-stats">参加者 128人 · スレッド 12件</p>
            </div>
          </div>

          <article class="post">
            <div class="post-role dev">開発者</div>
            <p class="post-body">
              v0.4で3面の敵配置を調整しました。難しさの印象を教えてください。
            </p>
          </article>
          <article class="post">
            <div class="post-role player">プレイヤー</div>
            <p class="post-body">前より理不尽さが減って遊びやすくなりました。</p>
          </article>
          <article class="post">
            <div class="post-role player">プレイヤー</div>
            <p class="post-body">リトライ前の演出が少し長いかも。</p>
          </article>
          <article class="post">
            <div class="post-role dev">開発者</div>
            <p class="post-body">次はボス前のテンポを見直します。また遊んで声を届けてください。</p>
          </article>
        </div>
      </div>
    </div>
  </body>
</html>
