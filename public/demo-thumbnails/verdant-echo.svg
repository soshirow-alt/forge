<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="forest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#forest)"/>
  <!-- sunbeams -->
  <path d="M300 0 L340 0 L420 360 L260 360Z" fill="#fef9c3" opacity="0.06"/>
  <path d="M200 0 L230 0 L280 360 L170 360Z" fill="#fef9c3" opacity="0.04"/>
  <!-- giant trees -->
  <rect x="60" y="80" width="40" height="200" fill="#422006"/>
  <ellipse cx="80" cy="70" rx="70" ry="55" fill="#166534"/>
  <rect x="520" y="60" width="50" height="220" fill="#422006"/>
  <ellipse cx="545" cy="50" rx="80" ry="60" fill="#15803d"/>
  <rect x="280" y="100" width="35" height="180" fill="#422006"/>
  <ellipse cx="297" cy="90" rx="60" ry="50" fill="#16a34a"/>
  <!-- spirit creature -->
  <g transform="translate(400,160)">
    <ellipse cx="0" cy="0" rx="35" ry="45" fill="#86efac" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="20" ry="28" fill="#bbf7d0" opacity="0.7"/>
    <circle cx="-8" cy="-5" r="4" fill="#052e16"/>
    <circle cx="8" cy="-5" r="4" fill="#052e16"/>
    <path d="M-15 10 Q0 20 15 10" fill="none" stroke="#052e16" stroke-width="2"/>
    <ellipse cx="-30" cy="10" rx="15" ry="8" fill="#86efac" opacity="0.4"/>
    <ellipse cx="30" cy="10" rx="15" ry="8" fill="#86efac" opacity="0.4"/>
  </g>
  <!-- player explorer -->
  <g transform="translate(220,240)">
    <ellipse cx="20" cy="55" rx="22" ry="7" fill="#000" opacity="0.3"/>
    <rect x="8" y="10" width="24" height="45" rx="4" fill="#78350f"/>
    <circle cx="20" cy="0" r="12" fill="#fcd34d"/>
    <rect x="30" y="25" width="25" height="6" rx="2" fill="#57534e" transform="rotate(15 30 25)"/>
  </g>
  <!-- ground foliage -->
  <ellipse cx="320" cy="320" rx="200" ry="30" fill="#166534" opacity="0.5"/>
  <!-- quest marker -->
  <path d="M400 100 L410 130 L400 125 L390 130Z" fill="#fbbf24" opacity="0.9"/>
</svg>
