<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="arena-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#arena-sky)"/>
  <!-- floating arena ring -->
  <ellipse cx="320" cy="280" rx="220" ry="40" fill="#292524"/>
  <ellipse cx="320" cy="270" rx="200" ry="35" fill="#44403c"/>
  <ellipse cx="320" cy="265" rx="180" ry="30" fill="#57534e"/>
  <!-- arena walls -->
  <path d="M120 265 Q320 180 520 265" fill="none" stroke="#78716c" stroke-width="8"/>
  <!-- fighter left -->
  <g transform="translate(220,220)">
    <rect x="10" y="20" width="30" height="45" rx="4" fill="#2563eb"/>
    <circle cx="25" cy="8" r="12" fill="#fcd34d"/>
    <rect x="35" y="25" width="6" height="50" fill="#94a3b8"/>
    <path d="M41 25 L60 10 L41 30Z" fill="#e2e8f0"/>
  </g>
  <!-- fighter right -->
  <g transform="translate(380,220)">
    <rect x="10" y="20" width="30" height="45" rx="4" fill="#dc2626"/>
    <circle cx="25" cy="8" r="12" fill="#fcd34d"/>
    <rect x="-5" y="25" width="6" height="50" fill="#94a3b8"/>
    <path d="M-5 25 L-24 10 L-5 30Z" fill="#e2e8f0"/>
  </g>
  <!-- clash spark -->
  <circle cx="320" cy="230" r="25" fill="#fbbf24" opacity="0.5"/>
  <circle cx="320" cy="230" r="12" fill="#fff" opacity="0.8"/>
  <line x1="300" y1="210" x2="340" y2="250" stroke="#fef3c7" stroke-width="3"/>
  <line x1="340" y1="210" x2="300" y2="250" stroke="#fef3c7" stroke-width="3"/>
  <!-- crowd silhouettes -->
  <g fill="#0c0a09" opacity="0.4">
    <ellipse cx="100" cy="100" rx="40" ry="20"/><ellipse cx="540" cy="90" rx="50" ry="25"/>
  </g>
  <!-- health bars -->
  <rect x="40" y="24" width="120" height="10" rx="2" fill="#1c1917"/>
  <rect x="40" y="24" width="80" height="10" rx="2" fill="#2563eb"/>
  <rect x="480" y="24" width="120" height="10" rx="2" fill="#1c1917"/>
  <rect x="520" y="24" width="60" height="10" rx="2" fill="#dc2626"/>
</svg>
