      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <!-- floating arena platform -->
  <ellipse cx="320" cy="290" rx="220" ry="35" fill="#334155" opacity="0.8"/>
  <path d="M120 290 L520 290 L500 270 L140 270Z" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
