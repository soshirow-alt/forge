  <circle cx="320" cy="230" r="10" fill="#fff" opacity="0.7"/>
  <!-- floating debris -->
  <rect x="150" y="120" width="30" height="20" fill="#64748b" transform="rotate(-15 165 130)" opacity="0.6"/>
  <rect x="480" y="100" width="25" height="18" fill="#64748b" transform="rotate(20 492 109)" opacity="0.6"/>
  <text x="24" y="42" fill="#fff" font-family="sans-serif" font-size="28" font-weight="bold">??????</text>
  <text x="24" y="66" fill="#fcd34d" font-family="sans-serif" font-size="11" letter-spacing="4">CYBERPUNK ? FIGHTING</text>
