    <rect x="408" y="220" width="24" height="38" rx="2"/>
    <circle cx="420" cy="208" r="12"/>
    <path d="M408 230 L380 210" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- impact spark -->
