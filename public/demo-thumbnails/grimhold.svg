<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#0c0a09"/>
  <!-- dungeon corridor perspective -->
  <path d="M0 360 L200 120 L440 120 L640 360Z" fill="#1c1917"/>
  <path d="M220 120 L420 120 L640 360 L0 360Z" fill="#292524"/>
  <!-- stone arches -->
  <path d="M220 120 Q320 60 420 120" fill="none" stroke="#44403c" stroke-width="6"/>
  <path d="M240 120 Q320 80 400 120" fill="none" stroke="#57534e" stroke-width="3"/>
  <!-- torch left -->
  <rect x="230" y="140" width="8" height="30" fill="#78350f"/>
  <g fill="#f97316" opacity="0.9">
    <ellipse cx="234" cy="135" rx="10" ry="16"/>
    <ellipse cx="234" cy="130" rx="6" ry="10" fill="#fbbf24"/>
  </g>
  <!-- torch right -->
  <rect x="402" y="140" width="8" height="30" fill="#78350f"/>
  <g fill="#f97316" opacity="0.9">
    <ellipse cx="406" cy="135" rx="10" ry="16"/>
  </g>
  <!-- monster eyes in darkness -->
  <g fill="#ef4444">
    <circle cx="320" cy="200" r="5"/><circle cx="340" cy="200" r="5"/>
    <circle cx="300" cy="230" r="3" opacity="0.6"/><circle cx="360" cy="228" r="3" opacity="0.6"/>
  </g>
  <!-- adventurer with sword -->
  <g transform="translate(290,260)">
    <ellipse cx="20" cy="55" rx="22" ry="7" fill="#000" opacity="0.5"/>
    <rect x="8" y="10" width="24" height="45" rx="3" fill="#44403c"/>
    <circle cx="20" cy="0" r="10" fill="#78716c"/>
    <rect x="30" y="15" width="5" height="45" fill="#57534e"/>
    <path d="M35 15 L50 5 L35 22Z" fill="#a8a29e"/>
  </g>
  <!-- light pool from torch -->
  <ellipse cx="234" cy="280" rx="80" ry="30" fill="#f97316" opacity="0.08"/>
  <ellipse cx="406" cy="280" rx="80" ry="30" fill="#f97316" opacity="0.08"/>
</svg>
