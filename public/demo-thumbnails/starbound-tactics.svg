<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <radialGradient id="space" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="planet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#space)"/>
  <!-- stars -->
  <g fill="#fff" opacity="0.8">
    <circle cx="80" cy="50" r="1.2"/><circle cx="200" cy="90" r="1"/><circle cx="450" cy="40" r="1.3"/>
    <circle cx="560" cy="100" r="1"/><circle cx="120" cy="150" r="0.8"/><circle cx="580" cy="180" r="1.1"/>
  </g>
  <!-- planet -->
  <circle cx="480" cy="120" r="55" fill="url(#planet)"/>
  <ellipse cx="460" cy="110" rx="25" ry="8" fill="#818cf8" opacity="0.3" transform="rotate(-20 460 110)"/>
  <circle cx="500" cy="100" r="12" fill="#4f46e5" opacity="0.5"/>
  <!-- laser beams -->
  <g opacity="0.85">
    <line x1="180" y1="200" x2="320" y2="170" stroke="#f472b6" stroke-width="3"/>
    <line x1="320" y1="170" x2="400" y2="140" stroke="#f472b6" stroke-width="2" opacity="0.7"/>
    <line x1="420" y1="210" x2="280" y2="180" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="320" cy="170" r="6" fill="#fda4af"/>
    <circle cx="280" cy="180" r="5" fill="#67e8f9"/>
  </g>
  <!-- player fleet ship -->
  <g transform="translate(140,185) rotate(-15)">
    <path d="M0 20 L40 0 L80 15 L70 25 L40 20 L10 30Z" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M35 5 L45 -8 L50 5Z" fill="#94a3b8"/>
    <rect x="38" y="18" width="8" height="6" fill="#22d3ee" opacity="0.8"/>
  </g>
  <!-- enemy cruiser -->
  <g transform="translate(380,160) rotate(10)">
    <path d="M0 25 L30 10 L90 20 L100 35 L85 40 L20 38 L0 30Z" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="40" y="15" width="20" height="10" fill="#ef4444" opacity="0.7"/>
    <circle cx="70" cy="28" r="5" fill="#f87171"/>
  </g>
  <!-- small fighters -->
  <g fill="#818cf8">
    <path d="M250 220 L265 210 L280 220 L265 225Z"/>
    <path d="M520 200 L532 192 L545 200 L532 205Z" fill="#a5b4fc"/>
  </g>
  <text x="24" y="42" fill="#c7d2fe" font-family="sans-serif" font-size="28" font-weight="bold">星界戦術</text>
  <text x="24" y="66" fill="#818cf8" font-family="sans-serif" font-size="11" letter-spacing="4">SCI-FI · FLEET STRATEGY</text>
</svg>
