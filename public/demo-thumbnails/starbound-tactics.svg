<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#020617"/>
  <!-- stars -->
  <g fill="#fff" opacity="0.6">
    <circle cx="80" cy="40" r="1"/><circle cx="200" cy="80" r="1.5"/><circle cx="500" cy="50" r="1"/>
    <circle cx="580" cy="100" r="1"/><circle cx="350" cy="30" r="1"/><circle cx="120" cy="120" r="1"/>
  </g>
  <!-- nebula -->
  <ellipse cx="400" cy="100" rx="200" ry="80" fill="#4c1d95" opacity="0.25"/>
  <ellipse cx="200" cy="180" rx="150" ry="60" fill="#1e3a8a" opacity="0.2"/>
  <!-- planet -->
  <circle cx="520" cy="260" r="55" fill="#1e293b"/>
  <ellipse cx="500" cy="250" rx="40" ry="15" fill="#334155" opacity="0.5"/>
  <!-- player fleet -->
  <g fill="#3b82f6">
    <path d="M180 200 L200 180 L220 200 L200 210Z"/>
    <path d="M160 220 L175 205 L190 220 L175 228Z" opacity="0.8"/>
    <path d="M200 220 L215 205 L230 220 L215 228Z" opacity="0.8"/>
  </g>
  <!-- enemy fleet -->
  <g fill="#ef4444">
    <path d="M420 160 L440 140 L460 160 L440 170Z"/>
    <path d="M400 175 L415 160 L430 175 L415 183Z" opacity="0.8"/>
    <path d="M440 175 L455 160 L470 175 L455 183Z" opacity="0.8"/>
  </g>
  <!-- laser fire -->
  <line x1="220" y1="200" x2="400" y2="165" stroke="#60a5fa" stroke-width="2" opacity="0.8"/>
  <line x1="230" y1="205" x2="410" y2="170" stroke="#93c5fd" stroke-width="1" opacity="0.5"/>
  <line x1="400" y1="165" x2="220" y2="210" stroke="#f87171" stroke-width="2" opacity="0.7"/>
  <!-- explosion -->
  <circle cx="310" cy="185" r="20" fill="#fbbf24" opacity="0.4"/>
  <circle cx="310" cy="185" r="10" fill="#fff" opacity="0.6"/>
  <!-- tactical UI -->
  <rect x="12" y="12" width="140" height="90" rx="4" fill="#0f172a" opacity="0.75" stroke="#334155"/>
  <rect x="20" y="24" width="60" height="6" fill="#22c55e"/>
  <rect x="20" y="36" width="40" height="6" fill="#3b82f6"/>
  <rect x="20" y="48" width="50" height="6" fill="#ef4444"/>
  <circle cx="560" cy="40" r="30" fill="none" stroke="#64748b" stroke-width="1" opacity="0.5"/>
  <line x1="560" y1="40" x2="590" y2="25" stroke="#94a3b8" stroke-width="1"/>
</svg>
