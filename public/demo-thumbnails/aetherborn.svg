<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky-a)"/>
  <!-- cloud kingdom -->
  <ellipse cx="200" cy="200" rx="120" ry="40" fill="#fff" opacity="0.85"/>
  <ellipse cx="280" cy="180" rx="100" ry="35" fill="#fff" opacity="0.9"/>
  <ellipse cx="450" cy="210" rx="130" ry="45" fill="#fff" opacity="0.8"/>
  <ellipse cx="100" cy="230" rx="80" ry="30" fill="#fff" opacity="0.7"/>
  <!-- floating temple -->
  <rect x="380" y="120" width="80" height="60" fill="#e9d5ff"/>
  <path d="M420 90 L450 120 L390 120Z" fill="#c4b5fd"/>
  <rect x="405" y="140" width="30" height="40" fill="#7c3aed"/>
  <!-- flying player -->
  <g transform="translate(240,160)">
    <ellipse cx="20" cy="50" rx="30" ry="10" fill="#000" opacity="0.15"/>
    <path d="M0 30 Q20 0 40 30 L35 45 Q20 35 5 45Z" fill="#8b5cf6"/>
    <circle cx="20" cy="18" r="10" fill="#fde68a"/>
    <path d="M-10 25 L-30 15 L-10 35Z" fill="#a78bfa" opacity="0.7"/>
    <path d="M50 25 L70 15 L50 35Z" fill="#a78bfa" opacity="0.7"/>
  </g>
  <!-- wind streaks -->
  <g stroke="#fff" stroke-width="2" opacity="0.3" stroke-linecap="round">
    <line x1="0" y1="100" x2="60" y2="100"/><line x1="580" y1="140" x2="640" y2="140"/>
  </g>
  <!-- altitude HUD -->
  <text x="20" y="32" fill="#e9d5ff" font-family="monospace" font-size="14">ALT 2,400m</text>
</svg>
