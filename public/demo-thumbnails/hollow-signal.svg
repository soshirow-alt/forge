<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#0a0a0f"/>
  <!-- abandoned lab corridor -->
  <path d="M0 360 L200 180 L440 180 L640 360Z" fill="#18181b"/>
  <path d="M220 180 L420 180 L640 360 L0 360Z" fill="#27272a"/>
  <rect x="180" y="40" width="280" height="140" fill="#1c1917"/>
  <!-- flickering monitors -->
  <rect x="200" y="60" width="70" height="50" fill="#0c0a09" stroke="#334155" stroke-width="2"/>
  <rect x="290" y="60" width="70" height="50" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <rect x="380" y="60" width="60" height="50" fill="#0c0a09" stroke="#334155" stroke-width="2"/>
  <text x="298" y="92" fill="#22d3ee" font-family="monospace" font-size="10">SIGNAL LOST</text>
  <!-- survivor with flashlight -->
  <g transform="translate(300,210)">
    <ellipse cx="20" cy="85" rx="25" ry="8" fill="#000" opacity="0.6"/>
    <rect x="8" y="35" width="24" height="50" rx="4" fill="#292524"/>
    <circle cx="20" cy="22" r="13" fill="#44403c"/>
    <rect x="28" y="50" width="30" height="8" rx="2" fill="#57534e" transform="rotate(-20 28 50)"/>
    <circle cx="55" cy="42" r="18" fill="#fef3c7" opacity="0.15"/>
    <circle cx="55" cy="42" r="10" fill="#fef9c3" opacity="0.35"/>
  </g>
  <!-- cone of light -->
  <path d="M330 240 L480 360 L180 360Z" fill="#fef3c7" opacity="0.06"/>
  <!-- static overlay -->
  <g opacity="0.08">
    <rect x="0" y="0" width="640" height="360" fill="url(#noise)"/>
  </g>
  <!-- HUD heartbeat -->
  <polyline points="16,40 28,40 32,28 36,52 40,40 80,40" fill="none" stroke="#ef4444" stroke-width="2"/>
  <rect x="16" y="52" width="100" height="8" rx="2" fill="#1c1917"/>
  <rect x="16" y="52" width="35" height="8" rx="2" fill="#ef4444" opacity="0.8"/>
</svg>
