<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#0c0a1a"/>
  <!-- void below -->
  <rect y="200" width="640" height="160" fill="#020617"/>
  <ellipse cx="320" cy="200" rx="280" ry="30" fill="#312e81" opacity="0.4"/>
  <!-- floating platforms -->
  <rect x="80" y="160" width="120" height="24" rx="4" fill="#4338ca"/>
  <rect x="260" y="120" width="120" height="24" rx="4" fill="#6366f1"/>
  <rect x="440" y="150" width="120" height="24" rx="4" fill="#4338ca"/>
  <rect x="180" y="80" width="100" height="20" rx="4" fill="#818cf8" opacity="0.7"/>
  <!-- rift energy -->
  <ellipse cx="320" cy="280" rx="100" ry="20" fill="#a855f7" opacity="0.3"/>
  <path d="M280 200 Q320 240 360 200" fill="none" stroke="#c084fc" stroke-width="3" opacity="0.6"/>
  <!-- runner mid-jump -->
  <g transform="translate(300,130)">
    <ellipse cx="20" cy="55" rx="20" ry="6" fill="#000" opacity="0.4"/>
    <rect x="8" y="15" width="24" height="38" rx="4" fill="#7c3aed"/>
    <circle cx="20" cy="5" r="11" fill="#ddd6fe"/>
    <path d="M5 25 L-5 45 L8 45 L12 30 L20 50 L28 30 L32 45 L45 45 L35 25Z" fill="#5b21b6"/>
    <path d="M32 20 L55 10 L50 25 L35 28Z" fill="#a78bfa"/>
  </g>
  <!-- motion trail -->
  <g opacity="0.4" fill="#c084fc">
    <circle cx="250" cy="150" r="4"/><circle cx="235" cy="160" r="3"/><circle cx="220" cy="172" r="2"/>
  </g>
  <!-- HUD -->
  <text x="20" y="32" fill="#c084fc" font-family="monospace" font-size="18">COMBO x12</text>
  <rect x="520" y="16" width="100" height="8" rx="2" fill="#1e1b4b"/>
  <rect x="520" y="16" width="70" height="8" rx="2" fill="#a855f7"/>
</svg>
