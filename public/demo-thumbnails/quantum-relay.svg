<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#020617"/>
  <!-- lab chamber -->
  <rect x="80" y="60" width="480" height="240" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- portal ring -->
  <circle cx="320" cy="180" r="80" fill="none" stroke="#06b6d4" stroke-width="6"/>
  <circle cx="320" cy="180" r="65" fill="none" stroke="#a855f7" stroke-width="3"/>
  <ellipse cx="320" cy="180" rx="55" ry="55" fill="#1e1b4b" opacity="0.8"/>
  <ellipse cx="320" cy="180" rx="40" ry="40" fill="#312e81"/>
  <ellipse cx="320" cy="180" rx="25" ry="25" fill="#6366f1" opacity="0.6"/>
  <!-- scientist stepping through -->
  <g transform="translate(280,200)">
    <rect x="10" y="10" width="22" height="40" rx="3" fill="#fff"/>
    <circle cx="21" cy="0" r="10" fill="#fcd34d"/>
    <rect x="32" y="20" width="15" height="8" fill="#64748b"/>
  </g>
  <!-- energy particles -->
  <g fill="#67e8f9">
    <circle cx="250" cy="150" r="3" opacity="0.8"/><circle cx="390" cy="140" r="2"/>
    <circle cx="370" cy="220" r="3" opacity="0.6"/><circle cx="260" cy="210" r="2"/>
  </g>
  <!-- control panels -->
  <rect x="100" y="280" width="100" height="50" rx="4" fill="#1e293b" stroke="#475569"/>
  <rect x="440" y="280" width="100" height="50" rx="4" fill="#1e293b" stroke="#475569"/>
  <text x="115" y="310" fill="#22d3ee" font-family="monospace" font-size="10">RELAY ONLINE</text>
  <!-- warning stripes floor -->
  <path d="M0 320 L640 320" stroke="#eab308" stroke-width="4" opacity="0.5"/>
</svg>
