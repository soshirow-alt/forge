<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#1c1917"/>
  <!-- night sky -->
  <rect width="640" height="180" fill="#0f172a"/>
  <circle cx="560" cy="50" r="25" fill="#fef9c3" opacity="0.5"/>
  <!-- castle walls -->
  <rect x="0" y="120" width="640" height="80" fill="#44403c"/>
  <rect x="0" y="110" width="640" height="20" fill="#57534e"/>
  <!-- battlements -->
  <g fill="#57534e">
    <rect x="40" y="95" width="20" height="25"/><rect x="80" y="95" width="20" height="25"/>
    <rect x="540" y="95" width="20" height="25"/><rect x="580" y="95" width="20" height="25"/>
  </g>
  <!-- defenders on wall -->
  <g transform="translate(200,155)">
    <rect x="5" y="10" width="18" height="30" fill="#78350f"/>
    <circle cx="14" cy="2" r="8" fill="#fcd34d"/>
    <rect x="22" y="15" width="4" height="25" fill="#78716c"/>
  </g>
  <g transform="translate(400,155)">
    <rect x="5" y="10" width="18" height="30" fill="#78350f"/>
    <circle cx="14" cy="2" r="8" fill="#fcd34d"/>
    <rect x="-2" y="12" width="20" height="4" fill="#57534e"/>
  </g>
  <!-- wolves below -->
  <g fill="#27272a">
    <ellipse cx="120" cy="280" rx="35" ry="18"/>
    <circle cx="95" cy="265" r="14"/><circle cx="145" cy="265" r="14"/>
    <path d="M90 255 L75 245 L85 260Z" fill="#44403c"/>
    <path d="M150 255 L165 245 L155 260Z" fill="#44403c"/>
    <ellipse cx="320" cy="300" rx="40" ry="20"/>
    <circle cx="290" cy="282" r="16"/><circle cx="350" cy="282" r="16"/>
    <ellipse cx="520" cy="290" rx="38" ry="18"/>
    <circle cx="495" cy="273" r="14"/><circle cx="545" cy="273" r="14"/>
  </g>
  <!-- wolf eyes -->
  <g fill="#ef4444">
    <circle cx="92" cy="263" r="2"/><circle cx="102" cy="263" r="2"/>
    <circle cx="287" cy="280" r="2"/><circle cx="297" cy="280" r="2"/>
    <circle cx="492" cy="271" r="2"/><circle cx="502" cy="271" r="2"/>
  </g>
  <!-- ground -->
  <rect y="200" width="640" height="160" fill="#292524"/>
  <!-- torch fire -->
  <g fill="#f97316" opacity="0.8">
    <ellipse cx="60" cy="170" rx="6" ry="12"/><ellipse cx="580" cy="170" rx="6" ry="12"/>
  </g>
</svg>
