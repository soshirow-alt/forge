<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#night)"/>
  <!-- barricade ring -->
  <ellipse cx="320" cy="200" rx="150" ry="40" fill="none" stroke="#64748b" stroke-width="3"/>
  <g fill="#475569" stroke="#94a3b8" stroke-width="1">
    <rect x="170" y="185" width="20" height="30" transform="rotate(-30 180 200)"/>
    <rect x="450" y="185" width="20" height="30" transform="rotate(30 460 200)"/>
    <rect x="310" y="155" width="20" height="30"/>
    <rect x="310" y="225" width="20" height="30"/>
  </g>
  <!-- wolves / enemies approaching -->
  <g fill="#1c1917">
    <path d="M80 250 L100 235 L120 250 L105 258Z"/>
    <path d="M520 245 L545 228 L565 245 L548 255Z"/>
    <path d="M300 120 L320 105 L340 120 L325 128Z"/>
  </g>
  <g fill="#ef4444" opacity="0.6">
    <circle cx="100" cy="238" r="3"/><circle cx="545" cy="233" r="3"/><circle cx="325" cy="110" r="3"/>
  </g>
  <!-- four defenders -->
  <g fill="#334155">
    <circle cx="250" cy="195" r="10"/><rect x="244" y="205" width="12" height="22"/>
    <circle cx="290" cy="190" r="10"/><rect x="284" y="200" width="12" height="22"/>
    <circle cx="330" cy="190" r="10"/><rect x="324" y="200" width="12" height="22"/>
    <circle cx="370" cy="195" r="10"/><rect x="364" y="205" width="12" height="22"/>
  </g>
  <!-- campfire center -->
  <ellipse cx="320" cy="210" rx="15" ry="8" fill="#ea580c" opacity="0.8"/>
  <ellipse cx="320" cy="205" rx="8" ry="12" fill="#fbbf24" opacity="0.9"/>
  <text x="24" y="42" fill="#e2e8f0" font-family="sans-serif" font-size="26" font-weight="bold">?????</text>
  <text x="24" y="66" fill="#f97316" font-family="sans-serif" font-size="11" letter-spacing="4">CO-OP · TOWER DEFENSE</text>
</svg>
