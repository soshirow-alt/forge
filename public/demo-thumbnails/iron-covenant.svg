<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#1c1917"/>
  <!-- war-torn battlefield -->
  <path d="M0 280 L640 240 L640 360 L0 360Z" fill="#292524"/>
  <path d="M0 300 L200 260 L400 270 L640 250 L640 360 L0 360Z" fill="#44403c"/>
  <!-- smoke -->
  <ellipse cx="150" cy="200" rx="80" ry="40" fill="#57534e" opacity="0.3"/>
  <ellipse cx="500" cy="180" rx="60" ry="30" fill="#78716c" opacity="0.25"/>
  <!-- enemy mech in crosshairs -->
  <g transform="translate(380,120)">
    <rect x="20" y="60" width="80" height="100" rx="8" fill="#3f3f46"/>
    <rect x="35" y="30" width="50" height="40" rx="6" fill="#52525b"/>
    <rect x="0" y="80" width="30" height="15" fill="#71717a"/>
    <rect x="100" y="80" width="30" height="15" fill="#71717a"/>
    <rect x="40" y="160" width="20" height="40" fill="#27272a"/>
    <rect x="60" y="160" width="20" height="40" fill="#27272a"/>
    <rect x="50" y="20" width="20" height="15" fill="#ef4444" opacity="0.8"/>
  </g>
  <!-- targeting reticle -->
  <circle cx="440" cy="200" r="50" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.7"/>
  <line x1="440" y1="140" x2="440" y2="160" stroke="#22c55e" stroke-width="2"/>
  <line x1="440" y1="240" x2="440" y2="260" stroke="#22c55e" stroke-width="2"/>
  <line x1="380" y1="200" x2="400" y2="200" stroke="#22c55e" stroke-width="2"/>
  <line x1="480" y1="200" x2="500" y2="200" stroke="#22c55e" stroke-width="2"/>
  <!-- cockpit frame -->
  <path d="M0 0 L640 0 L640 80 L580 60 L60 60 L0 80Z" fill="#0c0a09" opacity="0.85"/>
  <rect x="20" y="300" width="600" height="60" fill="#0c0a09" opacity="0.9"/>
  <!-- HUD panels -->
  <rect x="24" y="310" width="100" height="40" rx="4" fill="#18181b" stroke="#52525b"/>
  <text x="34" y="335" fill="#a3e635" font-family="monospace" font-size="11">ARMOR 78%</text>
  <rect x="516" y="310" width="100" height="40" rx="4" fill="#18181b" stroke="#52525b"/>
  <text x="530" y="335" fill="#f87171" font-family="monospace" font-size="11">TARGET LOCK</text>
</svg>
