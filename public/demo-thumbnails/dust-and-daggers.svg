<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#78350f"/>
  <!-- sandstorm -->
  <rect width="640" height="360" fill="#d97706" opacity="0.15"/>
  <g stroke="#fcd34d" stroke-width="1" opacity="0.2">
    <line x1="0" y1="80" x2="640" y2="100"/><line x1="0" y1="150" x2="640" y2="130"/>
    <line x1="0" y1="220" x2="640" y2="240"/>
  </g>
  <!-- canyon walls -->
  <path d="M0 360 L0 100 L180 200 L120 360Z" fill="#92400e"/>
  <path d="M640 360 L640 80 L460 180 L520 360Z" fill="#92400e"/>
  <path d="M0 300 L640 280 L640 360 L0 360Z" fill="#b45309"/>
  <!-- duelists -->
  <g transform="translate(180,220)">
    <ellipse cx="20" cy="55" rx="22" ry="7" fill="#000" opacity="0.4"/>
    <rect x="8" y="10" width="24" height="45" rx="3" fill="#451a03"/>
    <circle cx="20" cy="0" r="11" fill="#fcd34d"/>
    <path d="M35 20 L70 5 L35 28Z" fill="#e7e5e4"/>
    <rect x="30" y="18" width="4" height="40" fill="#78716c"/>
  </g>
  <g transform="translate(420,220)">
    <ellipse cx="20" cy="55" rx="22" ry="7" fill="#000" opacity="0.4"/>
    <rect x="8" y="10" width="24" height="45" rx="3" fill="#292524"/>
    <circle cx="20" cy="0" r="11" fill="#fcd34d"/>
    <path d="M5 20 L-30 5 L5 28Z" fill="#e7e5e4"/>
    <rect x="6" y="18" width="4" height="40" fill="#78716c"/>
  </g>
  <!-- sand kick -->
  <ellipse cx="320" cy="290" rx="80" ry="15" fill="#fde68a" opacity="0.3"/>
  <!-- sun -->
  <circle cx="500" cy="60" r="35" fill="#fef3c7" opacity="0.4"/>
</svg>
