<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="tunnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#tunnel)"/>
  <!-- neon city walls -->
  <path d="M0 120 L280 200 L360 200 L640 120 L640 360 L0 360Z" fill="#18181b"/>
  <path d="M300 200 L340 200 L640 360 L0 360Z" fill="#27272a"/>
  <g stroke-width="2">
    <line x1="320" y1="200" x2="320" y2="360" stroke="#06b6d4" opacity="0.9"/>
    <line x1="305" y1="210" x2="285" y2="360" stroke="#ec4899" opacity="0.5"/>
    <line x1="335" y1="210" x2="355" y2="360" stroke="#a855f7" opacity="0.5"/>
  </g>
  <!-- buildings -->
  <rect x="40" y="60" width="50" height="140" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1" opacity="0.8"/>
  <rect x="550" y="40" width="60" height="160" fill="#1e1b4b" stroke="#f472b6" stroke-width="1" opacity="0.8"/>
  <g fill="#22d3ee" opacity="0.7"><rect x="55" y="80" width="8" height="10"/><rect x="70" y="100" width="8" height="10"/><rect x="565" y="70" width="10" height="12"/></g>
  <!-- cockpit dash -->
  <path d="M0 280 Q320 220 640 280 L640 360 L0 360Z" fill="#09090b" opacity="0.95"/>
  <rect x="80" y="295" width="180" height="50" rx="8" fill="#18181b" stroke="#06b6d4" stroke-width="1"/>
  <text x="95" y="325" fill="#67e8f9" font-family="monospace" font-size="22">287 KM/H</text>
  <!-- car ahead -->
  <g transform="translate(250,230)">
    <path d="M0 30 L20 10 L90 5 L115 18 L120 35 L105 42 L25 42 Z" fill="#18181b" stroke="#ec4899" stroke-width="2"/>
    <circle cx="30" cy="42" r="11" fill="#0a0a0a" stroke="#f472b6" stroke-width="2"/>
    <circle cx="90" cy="42" r="11" fill="#0a0a0a" stroke="#f472b6" stroke-width="2"/>
    <rect x="45" y="14" width="35" height="10" fill="#06b6d4" opacity="0.7"/>
  </g>
  <ellipse cx="400" cy="250" rx="60" ry="15" fill="#67e8f9" opacity="0.2"/>
  <!-- speed lines -->
  <g stroke-linecap="round" opacity="0.6">
    <line x1="0" y1="250" x2="80" y2="250" stroke="#ec4899" stroke-width="2"/>
    <line x1="560" y1="265" x2="640" y2="265" stroke="#22d3ee" stroke-width="2"/>
  </g>
</svg>
