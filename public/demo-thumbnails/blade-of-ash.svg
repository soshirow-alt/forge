<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#1c1917"/>
  <!-- rain -->
  <g stroke="#94a3b8" stroke-width="1" opacity="0.3">
    <line x1="50" y1="0" x2="40" y2="30"/><line x1="150" y1="20" x2="140" y2="50"/>
    <line x1="300" y1="10" x2="290" y2="40"/><line x1="500" y1="30" x2="490" y2="60"/>
    <line x1="600" y1="0" x2="590" y2="30"/>
  </g>
  <!-- cherry blossoms -->
  <g fill="#fda4af" opacity="0.7">
    <circle cx="80" cy="60" r="4"/><circle cx="200" cy="40" r="3"/><circle cx="400" cy="70" r="4"/>
    <circle cx="550" cy="50" r="3"/><circle cx="320" cy="30" r="3"/><circle cx="120" cy="100" r="3"/>
  </g>
  <!-- torii gate -->
  <rect x="260" y="100" width="12" height="120" fill="#991b1b"/>
  <rect x="368" y="100" width="12" height="120" fill="#991b1b"/>
  <rect x="240" y="100" width="160" height="10" fill="#b91c1c"/>
  <rect x="250" y="130" width="140" height="8" fill="#b91c1c"/>
  <!-- samurai drawing blade -->
  <g transform="translate(300,210)">
    <ellipse cx="20" cy="70" rx="25" ry="8" fill="#000" opacity="0.4"/>
    <rect x="8" y="20" width="24" height="50" rx="3" fill="#292524"/>
    <circle cx="20" cy="8" r="11" fill="#44403c"/>
    <path d="M35 35 L90 15" stroke="#e7e5e4" stroke-width="3"/>
    <path d="M90 15 L110 5 L95 20Z" fill="#fbbf24"/>
    <!-- slash arc -->
    <path d="M40 30 Q80 10 120 40" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>
  </g>
  <!-- embers / ash -->
  <g fill="#fb923c" opacity="0.6">
    <circle cx="450" cy="200" r="2"/><circle cx="470" cy="220" r="1.5"/><circle cx="160" cy="180" r="2"/>
  </g>
</svg>
