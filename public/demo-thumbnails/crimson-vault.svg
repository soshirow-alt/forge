<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#1a0505"/>
  <!-- pixel dungeon walls -->
  <g fill="#450a0a">
    <rect x="0" y="0" width="640" height="40"/><rect x="0" y="320" width="640" height="40"/>
    <rect x="0" y="0" width="40" height="360"/><rect x="600" y="0" width="40" height="360"/>
  </g>
  <g fill="#7f1d1d" stroke="#991b1b" stroke-width="2">
    <rect x="80" y="240" width="80" height="80"/><rect x="480" y="200" width="80" height="120"/>
    <rect x="200" y="280" width="240" height="40"/>
  </g>
  <!-- treasure vault door -->
  <rect x="260" y="140" width="120" height="100" fill="#450a0a" stroke="#ef4444" stroke-width="4"/>
  <circle cx="320" cy="190" r="28" fill="none" stroke="#fca5a5" stroke-width="4"/>
  <circle cx="320" cy="190" r="8" fill="#ef4444"/>
  <!-- adventurer pixel silhouette -->
  <g fill="#1c1917">
    <rect x="140" y="220" width="24" height="32"/>
    <rect x="146" y="205" width="12" height="16"/>
    <rect x="164" y="215" width="20" height="6" fill="#78716c"/>
    <rect x="180" y="210" width="4" height="30" fill="#a8a29e"/>
  </g>
  <!-- skeleton enemy -->
  <g fill="#e7e5e4" opacity="0.7">
    <rect x="480" y="230" width="8" height="20"/><rect x="496" y="230" width="8" height="20"/>
    <rect x="484" y="215" width="20" height="16"/><circle cx="494" cy="210" r="8" fill="#fafaf9"/>
  </g>
  <!-- torch -->
  <rect x="60" y="180" width="6" height="40" fill="#78350f"/>
  <ellipse cx="63" cy="175" rx="10" ry="14" fill="#fb923c" opacity="0.9"/>
  <text x="24" y="42" fill="#fecaca" font-family="monospace" font-size="26" font-weight="bold">?????</text>
  <text x="24" y="66" fill="#ef4444" font-family="monospace" font-size="11" letter-spacing="3">PIXEL ? ROGUELIKE RPG</text>
</svg>
