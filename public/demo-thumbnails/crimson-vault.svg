<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#1a0505"/>
  <!-- vault corridor -->
  <path d="M0 360 L220 140 L420 140 L640 360Z" fill="#292524"/>
  <path d="M240 140 L400 140 L640 360 L0 360Z" fill="#1c1917"/>
  <!-- laser grid -->
  <g stroke="#ef4444" stroke-width="2" opacity="0.85">
    <line x1="240" y1="140" x2="180" y2="360"/>
    <line x1="280" y1="140" x2="260" y2="360"/>
    <line x1="320" y1="140" x2="320" y2="360"/>
    <line x1="360" y1="140" x2="380" y2="360"/>
    <line x1="400" y1="140" x2="460" y2="360"/>
    <line x1="240" y1="200" x2="400" y2="200"/>
    <line x1="220" y1="280" x2="420" y2="280"/>
  </g>
  <!-- vault door ahead -->
  <circle cx="320" cy="170" r="45" fill="#44403c" stroke="#78716c" stroke-width="4"/>
  <circle cx="320" cy="170" r="25" fill="#1c1917"/>
  <!-- thief rolling -->
  <g transform="translate(310,260)">
    <ellipse cx="20" cy="30" rx="28" ry="12" fill="#000" opacity="0.5"/>
    <ellipse cx="20" cy="15" rx="22" ry="18" fill="#18181b"/>
    <circle cx="20" cy="8" r="10" fill="#292524"/>
    <rect x="35" y="10" width="20" height="12" rx="3" fill="#78350f"/>
  </g>
  <!-- gold glow from vault -->
  <ellipse cx="320" cy="170" rx="60" ry="40" fill="#fbbf24" opacity="0.15"/>
  <!-- HUD alarm -->
  <rect x="16" y="16" width="160" height="28" rx="4" fill="#450a0a" stroke="#ef4444"/>
  <text x="28" y="35" fill="#fca5a5" font-family="monospace" font-size="12">ALARM: 00:47</text>
</svg>
