<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="moba-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#moba-sky)"/>
  <!-- titan back (MOBA map) -->
  <ellipse cx="320" cy="300" rx="280" ry="60" fill="#44403c"/>
  <path d="M80 300 Q320 180 560 300 L640 360 L0 360Z" fill="#57534e"/>
  <path d="M120 280 Q320 200 520 280" fill="none" stroke="#78716c" stroke-width="4"/>
  <!-- spine ridges -->
  <path d="M200 260 Q320 220 440 260" fill="none" stroke="#292524" stroke-width="8"/>
  <!-- lane minions fighting -->
  <g fill="#2563eb">
    <circle cx="250" cy="270" r="8"/><circle cx="270" cy="275" r="7"/><circle cx="230" cy="278" r="7"/>
  </g>
  <g fill="#dc2626">
    <circle cx="370" cy="270" r="8"/><circle cx="390" cy="275" r="7"/><circle cx="410" cy="278" r="7"/>
  </g>
  <!-- clash in center -->
  <circle cx="320" cy="272" r="15" fill="#fbbf24" opacity="0.5"/>
  <!-- hero champion -->
  <g transform="translate(300,230)">
    <rect x="10" y="15" width="20" height="35" rx="3" fill="#7c3aed"/>
    <circle cx="20" cy="5" r="10" fill="#fde68a"/>
    <rect x="28" y="20" width="5" height="40" fill="#94a3b8"/>
    <path d="M33 20 L50 8 L33 28Z" fill="#e2e8f0"/>
  </g>
  <!-- crystal objective -->
  <path d="M310 200 L320 170 L330 200 L320 210Z" fill="#22d3ee" opacity="0.9"/>
  <ellipse cx="320" cy="205" rx="15" ry="5" fill="#06b6d4" opacity="0.4"/>
  <!-- MOBA HUD -->
  <rect x="16" y="16" width="80" height="24" rx="4" fill="#0f172a" opacity="0.8"/>
  <text x="26" y="32" fill="#94a3b8" font-family="monospace" font-size="11">12 vs 11</text>
  <rect x="544" y="16" width="80" height="24" rx="4" fill="#0f172a" opacity="0.8"/>
  <text x="558" y="32" fill="#22c55e" font-family="monospace" font-size="11">LANE TOP</text>
</svg>
