<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#0f172a"/>
  <!-- circuit board floor -->
  <path d="M0 360 L640 280 L640 360Z" fill="#1e293b"/>
  <g stroke="#06b6d4" stroke-width="1" opacity="0.4" fill="none">
    <path d="M100 360 L100 300 L200 300 L200 260"/>
    <path d="M400 360 L400 320 L500 320 L500 270"/>
    <path d="M250 360 L250 290 L350 290"/>
  </g>
  <!-- glowing nodes -->
  <circle cx="200" cy="260" r="12" fill="#06b6d4" opacity="0.8"/>
  <circle cx="350" cy="290" r="12" fill="#a855f7" opacity="0.8"/>
  <circle cx="500" cy="270" r="12" fill="#22c55e" opacity="0.8"/>
  <circle cx="150" cy="300" r="10" fill="#f472b6" opacity="0.7"/>
  <!-- connection beam being placed -->
  <line x1="200" y1="260" x2="350" y2="290" stroke="#67e8f9" stroke-width="4" opacity="0.9"/>
  <line x1="350" y1="290" x2="500" y2="270" stroke="#c084fc" stroke-width="3" opacity="0.6" stroke-dasharray="8 4"/>
  <!-- player hands / cursor -->
  <g transform="translate(280,200)">
    <rect x="0" y="0" width="80" height="50" rx="6" fill="#334155" stroke="#64748b"/>
    <circle cx="60" cy="60" r="8" fill="#f8fafc" stroke="#06b6d4" stroke-width="2"/>
    <path d="M60 52 L60 20" stroke="#06b6d4" stroke-width="2"/>
  </g>
  <!-- puzzle UI -->
  <rect x="16" y="16" width="130" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="28" y="40" fill="#67e8f9" font-family="monospace" font-size="11">NODES: 3/5</text>
  <text x="28" y="58" fill="#a78bfa" font-family="monospace" font-size="11">PULSE: ACTIVE</text>
</svg>
