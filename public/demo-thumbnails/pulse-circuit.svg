<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#0a1628"/>
  <!-- mainframe cabinet -->
  <rect x="120" y="60" width="400" height="240" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="3"/>
  <rect x="140" y="80" width="360" height="200" fill="#020617"/>
  <!-- circuit paths -->
  <g stroke-width="2" fill="none">
    <path d="M160 120 H280 V160 H400" stroke="#06b6d4"/>
    <path d="M160 180 H240 V220 H360 V180 H480" stroke="#a855f7"/>
    <path d="M200 140 H200 200 H320" stroke="#22d3ee"/>
    <circle cx="280" cy="160" r="12" fill="#164e63" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="360" cy="180" r="12" fill="#4c1d95" stroke="#a855f7" stroke-width="2"/>
    <circle cx="240" cy="220" r="12" fill="#164e63" stroke="#22d3ee" stroke-width="2"/>
  </g>
  <!-- chip -->
  <rect x="300" y="130" width="50" height="50" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
  <g stroke="#78716c" stroke-width="1">
    <line x1="300" y1="140" x2="280" y2="140"/><line x1="300" y1="155" x2="280" y2="155"/>
    <line x1="350" y1="140" x2="370" y2="140"/><line x1="350" y1="155" x2="370" y2="155"/>
  </g>
  <!-- hacker hand silhouette -->
  <g fill="#1e293b" transform="translate(480,240)">
    <path d="M0 30 L10 0 L25 5 L20 25 L35 10 L40 35 L0 40Z"/>
  </g>
  <text x="24" y="42" fill="#67e8f9" font-family="monospace" font-size="24" font-weight="bold">?????</text>
  <text x="24" y="66" fill="#a855f7" font-family="monospace" font-size="11" letter-spacing="3">CYBERPUNK · PUZZLE</text>
</svg>
